# =============================================================================
# Starter watchlist of companies the scrape layer should always check.
# The discovery layer (Layer 1) will add MORE companies over time, but these
# are the manual seeds the candidate wants tracked from day one.
#
# Fields per company:
#   name:        Display name
#   ats:         Applicant tracking system — drives which scraper handles it.
#                One of: greenhouse, lever, workday, custom, unknown
#   ats_slug:    The company-specific identifier in their ATS URL.
#                Greenhouse example: boards.greenhouse.io/STRIPE   →  slug: stripe
#                Lever example:      jobs.lever.co/PLAID            →  slug: plaid
#   public:      true if publicly traded
#   ticker:      Stock ticker if public, used by company_health scoring
#   notes:       Free-text rationale or caveats
#
# To add a company: copy a block, change the fields, save the file.
# =============================================================================

include:

  # ---------- Big tech ----------
  - name: Apple
    ats: custom              # Apple uses their own jobs site
    ats_slug: null
    public: true
    ticker: AAPL
    notes: Custom ATS — Firecrawl fallback needed in Layer 3

  - name: Amazon
    ats: custom              # Amazon Jobs is custom
    ats_slug: null
    public: true
    ticker: AMZN
    notes: Massive PM org. Filter heavily by location and team to avoid noise.

  - name: Netflix
    ats: custom              # Netflix uses their own jobs page
    ats_slug: null
    public: true
    ticker: NFLX
    notes: Flat structure; limited PM headcount.

  - name: Google
    ats: custom              # Google careers is custom
    ats_slug: null
    public: true
    ticker: GOOGL
    notes: Custom ATS. Layer 3 will need Firecrawl. Huge PM surface area.

  # ---------- Fintech ----------
  - name: Stripe
    ats: greenhouse
    ats_slug: stripe
    public: false
    ticker: null
    notes: Pre-IPO but consistently rumored. Exempt from public-stock filter.

  - name: Plaid
    ats: greenhouse
    ats_slug: plaid
    public: false
    ticker: null
    notes: Pre-IPO. Exempt from public-stock filter.

  - name: Block
    ats: greenhouse
    ats_slug: block
    public: true
    ticker: SQ
    notes: Block (formerly Square). Multiple business units including Cash App.

  - name: PayPal
    ats: workday
    ats_slug: paypal
    workday_host: paypal.wd1.myworkdayjobs.com
    workday_site: jobs
    workday_search: product manager
    public: true
    ticker: PYPL
    notes: Configured for Workday adapter 2026-09-28. If first run logs HTTP 404, verify host/site by opening the PayPal careers page and checking the URL after "myworkdayjobs.com/".

  - name: Robinhood
    ats: greenhouse
    ats_slug: robinhood
    public: true
    ticker: HOOD

  # ---------- AI companies ----------
  - name: Scale AI
    ats: greenhouse
    ats_slug: scaleai
    public: false
    ticker: null
    notes: Data labeling + GenAI infra. Pre-IPO.

