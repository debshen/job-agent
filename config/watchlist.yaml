  - name: ServiceNow
    ats: workday
    ats_slug: servicenow
    workday_host: servicenow.wd1.myworkdayjobs.com
    workday_site: ServiceNowCareers
    workday_search: product manager
    public: true
    ticker: NOW
    notes: Configured for Workday adapter 2026-09-28. Strong AI moat (enterprise workflow + data). If first run logs HTTP 404, verify host/site by opening the ServiceNow careers page and checking the URL after "myworkdayjobs.com/".

  # ---------- Workday-hosted companies ----------
  - name: Salesforce
    ats: workday
    ats_slug: salesforce
    workday_host: salesforce.wd12.myworkdayjobs.com
    workday_site: External_Career_Site
    workday_search: product manager
    include_ic_director: true     # "Director of Product Management" is usually IC here; let scoring judge
    public: true
    ticker: CRM

