# =============================================================================
# Discovery pool — the universe of companies Layer 01 considers each night.
#
# WHY THIS EXISTS:
#   There's no free public API that says "give me every Bay Area tech company
#   with 500+ employees." Crunchbase has it but costs ~$30/mo, and the spec
#   for Layer 01 calls that out as a Stage-2 upgrade. Until then, we hand-curate
#   this pool and the discovery script:
#     1. Skips any company already on watchlist.yaml or in the exclude list.
#     2. Probes each pool entry's public Greenhouse/Lever board (free, no key).
#     3. Counts how many PM jobs are open right now in Bay Area.
#     4. Scores the company 0–100 (see criteria.yaml → discovery: section).
#     5. Routes high-scorers to watchlist.yaml or the review queue.
#
#   Once we add Crunchbase / Apify, this file becomes a *seed list* that the
#   automated discoverer adds to. For now it IS the discovery universe.
#
# ADDING COMPANIES:
#   Copy a block, fill in the fields, save. Next nightly run picks it up.
#   The slug is the only thing that matters for the probe — get it from the
#   company's public careers URL:
#     https://boards.greenhouse.io/SLUG/jobs        ← Greenhouse
#     https://jobs.lever.co/SLUG                    ← Lever
#   If the slug is wrong, the probe will log "404 — check slug" and skip.
#
# REMOVING COMPANIES:
#   Just delete the block, or set `enabled: false` to keep the entry as a note
#   without probing it.
#
# FIELDS PER COMPANY:
#   name:           Display name
#   ats:            "greenhouse" or "lever" → auto-probed for PM hiring activity.
#                   "custom"                → company runs its own careers site
#                                             (DoorDash, Notion, Apple, etc.).
#                                             Skipped at probe time, scored on
#                                             metadata only (max 70/100), and
#                                             routed to the review queue so you
#                                             can manually add to watchlist.yaml
#                                             if Layer 03 has an adapter.
#   ats_slug:       Required for greenhouse/lever (the slug in their ATS URL).
#                   Set to null for custom.
#   hq_bay_area:    true if HQ is San Francisco, Peninsula, South Bay, or East Bay
#   employees_est:  Rough headcount (used for the size filter; conservative is fine)
#   sector:         One of the sectors_preferred / sectors_excluded in criteria.yaml
#   notes:          Free-text reason this is on the pool, or caveats
#   enabled:        Optional, defaults to true. Set false to skip without deleting.
# =============================================================================

